# Monitor GitHub Actions and scan dependencies. No automatic merge in this repository.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions-patch:
        update-types: [patch]
      actions-minor:
        update-types: [minor]
  - package-ecosystem: pip
    directory: /.github/security
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      scanner-patches:
        update-types: [patch]
